# Benchmarks of a pull request against its base branch, both builds in the same run, and on
# Postgres what feathers-casl costs net. Reported in the job's summary, not failed: runners vary by
# about 15 % from run to run.

name: Benchmarks

on:
  pull_request:
  workflow_dispatch:

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password
  POSTGRES_DB: test

jobs:
  bench:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # the base branch, to build what this is compared to
          fetch-depth: 0

      - run: npm install -g corepack@latest
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"
      - run: pnpm i
      - name: compare with ${{ github.base_ref || 'main' }}
        run: pnpm run bench:compare
        env:
          BENCH_BASE_REF: origin/${{ github.base_ref || 'main' }}
          BENCH_SUMMARY: ${{ runner.temp }}/bench-summary.md
      - name: summary
        if: always()
        run: |
          {
            echo "### Benchmarks against ${{ github.base_ref || 'main' }}"
            echo "Median latency per case; ⚠️ beyond +15 %, about what runners vary by. On Postgres: the same calls without feathers-casl, and what it costs net."
            cat "${{ runner.temp }}/bench-summary.md" 2>/dev/null || echo "No results."
          } >> "$GITHUB_STEP_SUMMARY"
